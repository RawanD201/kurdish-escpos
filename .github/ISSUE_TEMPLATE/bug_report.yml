name: Bug report
description: Report text that prints incorrectly, an error, or other unexpected behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem. Please include enough
        detail for the issue to be reproduced. Do not report security
        vulnerabilities here; see the security policy instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The receipt code or JSON that shows the problem. Keep it as small as possible.
      render: php
    validations:
      required: true

  - type: textarea
    id: preview
    attributes:
      label: Preview image
      description: If the text looks wrong, attach the PNG preview (`$rendered->png`) and, if possible, a photo of the printed receipt.

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.3.12
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version (if applicable)
      placeholder: e.g. 12.10

  - type: input
    id: font
    attributes:
      label: Font
      description: The bundled Vazirmatn, or the name of the custom font you use.
      placeholder: e.g. Vazirmatn, NRT Reg

  - type: input
    id: printer
    attributes:
      label: Printer model and connection
      placeholder: e.g. Xprinter XP-80C, network
